<title>Scroll Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen tool. Editor panel on the left (tabs, forms), live site preview on the right.
   Under 900px the two panes swap with an Edit / Preview switch. */
:root{
  --bg:#f3f2ef; --panel:#ffffff; --field:#faf9f6; --ink:#1c1d1f; --muted:#696b70; --line:#e2e0db;
  --accent:#0f6e66; --accent-ink:#ffffff; --accent-soft:#e3f1ef; --danger:#b42318;
  --ui:"Instrument Sans","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141516; --panel:#1c1e20; --field:#232528; --ink:#ecebe7; --muted:#9b9da2; --line:#2e3033;
  --accent:#40c2b3; --accent-ink:#06201d; --accent-soft:#16302d; --danger:#f2766b; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141516; --panel:#1c1e20; --field:#232528; --ink:#ecebe7; --muted:#9b9da2; --line:#2e3033;
  --accent:#40c2b3; --accent-ink:#06201d; --accent-soft:#16302d; --danger:#f2766b; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--ui);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--panel);border-bottom:1px solid var(--line)}
.logo{font-weight:600;font-size:15px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.logo i{width:18px;height:18px;border-radius:5px;background:linear-gradient(180deg,var(--accent) 0 50%,color-mix(in srgb,var(--accent) 45%,transparent) 50%)}
.save{font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.save[data-s="saved"]::before{background:#2f9e6b}
.save[data-s="saving"]::before{background:#d9a21b}
.save[data-s="error"]{color:var(--danger)}.save[data-s="error"]::before{background:var(--danger)}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--panel);
  padding:7px 12px;border-radius:7px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 30%,var(--line))}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 8px;font-size:12px;border-radius:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field)}
.seg button{border:0;background:transparent;padding:6px 11px;cursor:pointer;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.mobile-switch{display:none}

.main{min-height:0;display:grid;grid-template-columns:minmax(340px,410px) 1fr}
.editor{min-height:0;display:grid;grid-template-rows:auto 1fr;background:var(--panel);border-right:1px solid var(--line)}
.tabs{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:9px 11px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.panel{overflow-y:auto;padding:18px 18px 60px;display:flex;flex-direction:column;gap:22px}
.group{display:flex;flex-direction:column;gap:12px}
.group > h3{margin:0;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.group > h3 .spacer{flex:1}
.note{margin:0;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:12px;font-weight:500;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
input[type=text],input[type=number],input[type=email],input[type=url],select,textarea{
  width:100%;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
textarea{resize:vertical;min-height:64px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.check input{accent-color:var(--accent);width:16px;height:16px}
.range{display:grid;grid-template-columns:1fr 52px;gap:10px;align-items:center}
.range input[type=range]{accent-color:var(--accent);width:100%}
.range output{font:500 12px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.color{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center}
.color input[type=color]{width:34px;height:34px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}

.card{border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.card-head{display:flex;align-items:center;gap:6px}
.card-head b{font-size:13px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-head .idx{font:500 11px var(--mono);color:var(--muted);width:22px}
.icon{border:1px solid transparent;background:none;border-radius:6px;width:26px;height:26px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center;font-size:14px;line-height:1}
.icon:hover{border-color:var(--line);color:var(--ink)}
.icon.danger:hover{color:var(--danger)}

.drop{border:1.5px dashed color-mix(in srgb,var(--ink) 25%,var(--line));border-radius:12px;padding:20px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;cursor:pointer;background:var(--field)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:14px}
.drop small{color:var(--muted)}
.progress{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.thumb{position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--field);aspect-ratio:16/10}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .n{position:absolute;left:5px;top:5px;font:500 10px var(--mono);background:rgba(0,0,0,.6);color:#fff;padding:2px 5px;border-radius:4px}
.thumb .tools{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;padding:3px;background:linear-gradient(transparent,rgba(0,0,0,.65));opacity:0;transition:opacity .15s}
.thumb:hover .tools,.thumb:focus-within .tools{opacity:1}
.thumb .tools button{border:0;background:rgba(255,255,255,.92);color:#111;border-radius:5px;width:22px;height:22px;cursor:pointer;font-size:12px;line-height:1}
.thumb .tools button.warn{background:#b42318;color:#fff;width:auto;padding:0 6px}
.meter{display:flex;justify-content:space-between;font:500 11px var(--mono);color:var(--muted)}
.swatches{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.swatch{border:1px solid var(--line);border-radius:9px;padding:9px;cursor:pointer;background:var(--panel);text-align:left;display:flex;flex-direction:column;gap:7px}
.swatch[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.swatch span{display:flex;gap:3px}.swatch span i{flex:1;height:16px;border-radius:3px}
.swatch b{font-size:12px;font-weight:500}
details.sec{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.sec > summary{list-style:none;cursor:pointer;padding:12px;display:flex;align-items:center;gap:10px;font-weight:600}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400;font-size:16px}
details.sec[open] > summary::after{content:"−"}
details.sec > div{padding:0 12px 14px;display:flex;flex-direction:column;gap:12px}
.pill{font:500 10px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:4px;background:var(--field);color:var(--muted);border:1px solid var(--line)}
.pill.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.banner{padding:10px 12px;border-radius:9px;background:var(--accent-soft);color:var(--ink);font-size:13px}
.banner.warn{background:color-mix(in srgb,var(--danger) 12%,var(--panel))}

.preview{min-height:0;display:grid;grid-template-rows:auto 1fr;background:var(--bg)}
.ptool{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.ptool .pct{font:500 11px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;min-width:96px}
.stagewrap{min-height:0;display:grid;place-items:center;padding:0 16px 16px}
.stagewrap iframe{width:100%;height:100%;border:1px solid var(--line);border-radius:10px;background:#1b120f;display:block}
.stagewrap.phone iframe{width:390px;max-width:100%;height:min(800px,100%);border-radius:28px;border:8px solid #111}
.full .main{grid-template-columns:1fr}.full .editor{display:none}

.siteview{position:fixed;inset:0;z-index:50;background:#1b120f}
.siteview iframe{width:100%;height:100%;border:0;display:block}
.siteview .back{position:fixed;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2}

@media (max-width:900px){
  .main{grid-template-columns:1fr}
  .mobile-switch{display:inline-flex}
  .app[data-pane="edit"] .preview{display:none}
  .app[data-pane="preview"] .editor{display:none}
  .editor{border-right:0}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app" id="app" data-pane="edit">
  <header class="top">
    <div class="logo"><i></i>Scroll Studio</div>
    <span class="save" id="save" data-s="idle">Loading</span>
    <span class="spacer"></span>
    <div class="seg mobile-switch" role="group" aria-label="Pane">
      <button type="button" data-pane="edit" aria-pressed="true">Edit</button>
      <button type="button" data-pane="preview" aria-pressed="false">Preview</button>
    </div>
    <button class="btn hide-sm" type="button" id="openSite">View as visitor</button>
    <button class="btn primary" type="button" id="goExport">Export site</button>
  </header>
  <div class="main">
    <section class="editor" aria-label="Editor">
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="media" aria-selected="true">Media</button>
        <button role="tab" data-tab="story" aria-selected="false">Story</button>
        <button role="tab" data-tab="style" aria-selected="false">Brand &amp; colors</button>
        <button role="tab" data-tab="sections" aria-selected="false">Sections</button>
        <button role="tab" data-tab="export" aria-selected="false">Export</button>
      </div>
      <div class="panel" id="panel"></div>
    </section>
    <section class="preview" aria-label="Live preview">
      <div class="ptool">
        <div class="seg" role="group" aria-label="Device">
          <button type="button" data-dev="desktop" aria-pressed="true">Desktop</button>
          <button type="button" data-dev="phone" aria-pressed="false">Phone</button>
        </div>
        <span class="pct" id="pct">Scroll 0%</span>
        <span class="spacer"></span>
        <button class="btn small" type="button" id="reload">Reload preview</button>
        <button class="btn small hide-sm" type="button" id="wide">Hide editor</button>
      </div>
      <div class="stagewrap" id="stagewrap"><iframe id="frame" title="Site preview"></iframe></div>
    </section>
  </div>
</div>
<div class="siteview" id="siteview" hidden><iframe id="siteframe" title="Site"></iframe><button class="btn back" type="button" id="closeSite" hidden>Back to editor</button></div>

<script type="text/plain" id="tpl"><!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="fontlink" href="__FONTS__">
<style>
:root{--bg:#f2ede5;--surface:#fbf8f3;--ink:#2b1e19;--muted:#6c5f57;--line:#ddd2c4;--accent:#b0132f;--accent-ink:#fff8f5;
  --stage-ink:#2a1d18;--stage-paper:#fffaf4;--scrim:.62;--display:Georgia,serif;--dw:500;--body:Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--body);-webkit-font-smoothing:antialiased}
img{max-width:100%}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
.nav{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;gap:24px;
  padding:calc(14px + env(safe-area-inset-top,0px)) var(--gr) 14px var(--gl);color:var(--stage-ink);transition:color .4s,background-color .4s,box-shadow .4s}
@media (min-width:900px){.nav{padding-left:max(48px,env(safe-area-inset-left,0px));padding-right:max(48px,env(safe-area-inset-right,0px))}}
.nav[data-tone="light"]{color:var(--stage-paper)}
.nav.solid{color:var(--ink);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);box-shadow:0 1px 0 var(--line)}
.brand{display:flex;flex-direction:column;line-height:1;text-decoration:none;margin-right:auto;min-width:0}
.brand-name{font:var(--dw) 1.45rem/1 var(--display);letter-spacing:-.01em}
.brand-sub{font:500 .62rem/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;margin-top:5px;opacity:.75}
.nav nav{display:flex;gap:28px;font-size:.9rem}
.nav nav a{text-decoration:none;opacity:.85}
.nav nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;text-decoration:none;background:var(--accent);color:var(--accent-ink);
  font:600 .88rem/1 var(--body);padding:11px 18px;border-radius:999px;transition:transform .2s,filter .2s;white-space:nowrap}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
@media (max-width:760px){.nav nav{display:none}}
.story{position:relative;height:640vh;background:#1b120f}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage::before{content:"";position:absolute;inset:0 0 auto;height:140px;z-index:1;pointer-events:none;background:linear-gradient(rgba(20,10,8,.45),transparent);opacity:var(--top-shade,0);transition:opacity .4s}
.scrim{position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0;
  background:linear-gradient(90deg,rgba(24,12,9,var(--scrim)) 0%,rgba(24,12,9,calc(var(--scrim)*.4)) 38%,transparent 62%)}
.chapters{position:absolute;inset:0;z-index:2;pointer-events:none}
.chapter{position:absolute;left:0;top:50%;width:min(34rem,100%);padding-left:max(24px,6vw,env(safe-area-inset-left,0px));padding-right:var(--gr);
  transform:translateY(-50%);opacity:0;visibility:hidden;color:var(--stage-paper);will-change:opacity,transform}
.chapter.dark{color:var(--stage-ink)}
.chapter.on{pointer-events:auto}
.eyebrow{font:500 .72rem/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;opacity:.8;margin:0 0 18px}
.chapter h1,.chapter h2{font:var(--dw) clamp(2.5rem,5.4vw,4.9rem)/1.02 var(--display);letter-spacing:-.025em;margin:0 0 20px;text-wrap:balance}
.chapter:not(.dark) h1,.chapter:not(.dark) h2{text-shadow:0 2px 30px rgba(0,0,0,.25)}
.chapter p{max-width:27rem;margin:0;font-size:1.02rem;opacity:.92}
.chapter .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.rail{position:absolute;z-index:2;right:max(28px,4vw,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);
  padding:18px 20px;color:var(--stage-paper);background:rgba(22,12,9,.38);backdrop-filter:blur(12px);border-radius:14px;min-width:190px}
.rail ol{list-style:none;margin:0;padding:0}
.day{font:500 .7rem/1 var(--mono);letter-spacing:.18em;text-transform:uppercase;opacity:.7;margin-bottom:6px}
.day-n{font:var(--dw) 2.4rem/1 var(--display);font-variant-numeric:tabular-nums;margin-bottom:14px}
.day-n small{font:400 .9rem var(--body);opacity:.6;margin-left:4px}
.rail li{display:flex;justify-content:space-between;gap:16px;font-size:.82rem;padding:5px 0;opacity:.4;transition:opacity .3s}
.rail li span:last-child{font:400 .72rem/1.6 var(--mono);font-variant-numeric:tabular-nums}
.rail li.done{opacity:.75}.rail li.now{opacity:1;font-weight:600}
.bar{position:absolute;z-index:2;left:0;bottom:0;height:3px;width:100%;transform-origin:left;transform:scaleX(0);background:var(--accent)}
.hint{position:absolute;z-index:2;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font:500 .7rem/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--stage-paper);text-shadow:0 1px 8px rgba(0,0,0,.4);display:flex;flex-direction:column;align-items:center;gap:10px}
.hint.dark{color:var(--stage-ink);text-shadow:none}
.hint::after{content:"";width:1px;height:34px;background:currentColor;animation:drip 1.8s ease-in-out infinite;transform-origin:top}
@keyframes drip{0%{transform:scaleY(0)}50%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media (max-width:760px){
  .scrim{background:linear-gradient(0deg,rgba(24,12,9,var(--scrim)) 0%,rgba(24,12,9,calc(var(--scrim)*.55)) 42%,transparent 66%);opacity:1!important}
  .chapter,.chapter.dark{top:auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:none;color:var(--stage-paper)}
  .chapter h1,.chapter h2{font-size:clamp(2.2rem,10vw,3rem)}
  .chapter p{font-size:.95rem}
  .rail{top:calc(78px + env(safe-area-inset-top,0px));right:var(--gr);transform:none;min-width:0;padding:10px 14px}
  .rail li{display:none}.rail .day-n{font-size:1.6rem;margin:0}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.hint::after{animation:none}html{scroll-behavior:auto}}
.band{padding-block:clamp(72px,10vw,140px);padding-left:var(--gl);padding-right:var(--gr)}
.band.alt{background:var(--surface);border-block:1px solid var(--line)}
.wrap{max-width:1180px;margin:0 auto}
.kicker{font:500 .72rem/1.4 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 16px}
.band h2{font:var(--dw) clamp(2.1rem,4.2vw,3.5rem)/1.05 var(--display);letter-spacing:-.02em;margin:0 0 22px;text-wrap:balance}
.lede{color:var(--muted);max-width:36rem;margin:0 0 12px}
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,96px);align-items:center}
.about > div{min-width:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:24px;margin-top:40px;padding-top:28px;border-top:1px solid var(--line)}
.stat b{display:block;font:var(--dw) clamp(1.8rem,3vw,2.5rem)/1 var(--display);font-variant-numeric:tabular-nums;color:var(--accent)}
.stat span{display:block;margin-top:8px;font-size:.85rem;color:var(--muted);line-height:1.4}
.photo{position:relative;margin:0;aspect-ratio:4/5;max-width:100%;border-radius:4px;overflow:hidden;background:#3a2620}
.photo canvas,.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo figcaption{position:absolute;left:14px;bottom:14px;font:500 .68rem/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#fff8f5;background:rgba(20,10,8,.5);padding:7px 10px;border-radius:3px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:clamp(24px,4vw,56px);margin-top:44px}
.svc article{min-width:0;padding-top:22px;border-top:2px solid var(--ink)}
.svc h3{font:var(--dw) 1.4rem/1.2 var(--display);margin:0 0 10px}
.svc p{margin:0;color:var(--muted);font-size:.95rem}
.steps{list-style:none;margin:44px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.steps li{min-width:0;padding:22px 20px 0 0;border-top:1px solid var(--line);position:relative}
.steps li::before{content:"";position:absolute;top:-5px;left:0;width:9px;height:9px;border-radius:50%;background:var(--accent)}
.steps .when{font:500 .72rem/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.steps h3{font:var(--dw) 1.15rem/1.25 var(--display);margin:10px 0 8px}
.steps p{margin:0;font-size:.9rem;color:var(--muted)}
.contact{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(32px,6vw,96px)}
.contact > div{min-width:0}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}.f.full{grid-column:1/-1}
label{font:500 .72rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
input,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;width:100%}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.form-foot{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:16px}
.status{font-size:.9rem;color:var(--muted);margin:0}
.reach{margin-top:28px;display:grid;gap:4px;font-size:.95rem;word-break:break-word}
.reach span{color:var(--muted)}
footer{background:var(--accent);color:var(--accent-ink);padding-block:22px calc(22px + env(safe-area-inset-bottom,0px));padding-left:var(--gl);padding-right:var(--gr)}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:center;font-size:.85rem}
footer .brand-name{font-size:1.2rem}
@media (max-width:900px){.about,.contact{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr}.steps li{padding:0 0 28px 26px;border-top:0;border-left:1px solid var(--line)}.steps li::before{top:4px;left:-5px}}
@media (max-width:520px){form{grid-template-columns:1fr}}
</style></head><body>

</main>

<script type="application/json" id="cfg">__CFG__<\/script>
<script>
(() => {
let CFG = JSON.parse(document.getElementById('cfg').textContent);
const PREVIEW = !!CFG.preview;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const W = 1600, H = 900, VPX = 800, VPY = 410;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (p, a, b) => clamp((p - a) / (b - a));
const ease = t => t * t * (3 - 2 * t);
const lerp = (a, b, t) => a + (b - a) * t;

function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const R = rng(7);

const K = (() => {
  const k = Math.max(innerWidth / W, innerHeight / H) * Math.min(devicePixelRatio || 1, 2);
  return clamp(k, 1, innerWidth < 760 ? 1.2 : 1.5);
})();
function layer() {
  const c = document.createElement('canvas'); c.width = Math.round(W * K); c.height = Math.round(H * K);
  const x = c.getContext('2d'); x.setTransform(K, 0, 0, K, 0, 0); x.lineCap = 'round'; x.lineJoin = 'round';
  return [c, x];
}
function poly(x, pts) { x.beginPath(); pts.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); }

// Room in one-point perspective. Back wall is depth Z=1; X,Y are offsets from the vanishing point.
const P = (X, Y, Z) => [VPX + X / Z, VPY + Y / Z];
const CEIL = [[0, 0], [W, 0], [1270, 120], [330, 120]];
const FLOOR = [[0, H], [330, 700], [1270, 700], [W, H]];
const LWALL = [[0, 0], [330, 120], [330, 700], [0, H]];
const RWALL = [[W, 0], [1270, 120], [1270, 700], [W, H]];
const BACK = [[330, 120], [1270, 120], [1270, 700], [330, 700]];
const LIGHTS = [P(-160, -290, .8), P(160, -290, .8), P(-168, -290, .95), P(168, -290, .95)];

const noise = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 160; const x = c.getContext('2d');
  const d = x.createImageData(160, 160);
  for (let i = 0; i < d.data.length; i += 4) { const v = 110 + R() * 145; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 40; }
  x.putImageData(d, 0, 0); return c;
})();
function grain(x, shape, a) { x.save(); shape(); x.clip(); x.globalAlpha = a; x.fillStyle = x.createPattern(noise, 'repeat'); x.fillRect(0, 0, W, H); x.restore(); }
function edgeShade(x, a = .14) {
  x.fillStyle = lin(x, 330, 0, 380, 0, [[0, `rgba(40,25,15,${a})`], [1, 'rgba(40,25,15,0)']]); x.fillRect(330, 120, 50, 580);
  x.fillStyle = lin(x, 1270, 0, 1220, 0, [[0, `rgba(40,25,15,${a})`], [1, 'rgba(40,25,15,0)']]); x.fillRect(1220, 120, 50, 580);
  x.fillStyle = lin(x, 0, 120, 0, 160, [[0, `rgba(40,25,15,${a})`], [1, 'rgba(40,25,15,0)']]); x.fillRect(330, 120, 940, 40);
  x.fillStyle = lin(x, 0, 700, 0, 660, [[0, `rgba(40,25,15,${a})`], [1, 'rgba(40,25,15,0)']]); x.fillRect(330, 660, 940, 40);
}
const lwTop = X => 120 * X / 330, lwBot = X => H - 200 * X / 330;
const rwTop = X => 120 * (W - X) / 330, rwBot = X => H - 200 * (W - X) / 330;

/* ---------- layers ---------- */
const L = {};

function buildRaw() {
  const [c, x] = layer();
  const fills = [[CEIL, '#e9e6e0'], [LWALL, '#d6d1c8'], [RWALL, '#ddd8cf'], [BACK, '#e4e0d7'], [FLOOR, '#a7a199']];
  fills.forEach(([s, f]) => { poly(x, s); x.fillStyle = f; x.fill(); });
  // concrete floor
  for (let i = 0; i < 90; i++) { const px = R() * W, py = 700 + R() * 200; ell(x, px, py, 20 + R() * 90, 4 + R() * 14); x.fillStyle = `rgba(${R() < .5 ? '70,66,60' : '200,196,188'},${.05 + R() * .08})`; x.fill(); }
  grain(x, () => poly(x, FLOOR), .9);
  // moisture board, lower right of back wall
  x.fillStyle = '#a9c0a3'; x.fillRect(1035, 410, 235, 290);
  // taped and mudded seams
  const mud = (x0, y0, x1, y1, w) => { x.strokeStyle = 'rgba(250,248,243,.85)'; x.lineWidth = w; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke();
    const n = Math.hypot(x1 - x0, y1 - y0) / 28; for (let i = 0; i < n; i++) { const t = i / n; ell(x, lerp(x0, x1, t) + (R() - .5) * w, lerp(y0, y1, t), w * (.5 + R()), w * (.4 + R() * .8)); x.fillStyle = 'rgba(252,250,246,.55)'; x.fill(); } };
  [565, 800, 1035].forEach(X => mud(X, 120, X, 700, 15));
  mud(330, 410, 1270, 410, 13); mud(1150, 410, 1150, 700, 12);
  [110, 225].forEach(X => mud(X, lwTop(X), X, lwBot(X), 16 * (1.2 - X / 600)));
  [1375, 1490].forEach(X => mud(X, rwTop(X), X, rwBot(X), 16 * (1.2 - (W - X) / 600)));
  mud(0, VPY, 330, VPY, 12); mud(1270, VPY, W, VPY, 12);
  [-235, 0, 235].forEach(X => { const [a, b] = P(X, -290, 1), [c2, d] = P(X, -290, .3); mud(c2, d, a, b, 10); });
  // screws
  x.fillStyle = 'rgba(255,255,255,.75)';
  for (let X = 350; X < 1270; X += 58) for (let Y = 150; Y < 690; Y += 48) if (Math.abs(X - 565) > 14 && Math.abs(X - 800) > 14 && Math.abs(X - 1035) > 14) { ell(x, X + (R() - .5) * 6, Y, 2.4, 2.4); x.fill(); }
  grain(x, () => { x.beginPath(); [CEIL, LWALL, RWALL, BACK].forEach(s => { s.forEach(([a, b], i) => i ? x.lineTo(a, b) : x.moveTo(a, b)); x.closePath(); }); }, .5);
  edgeShade(x, .16);
  // rough-in: ceiling holes and hanging wire
  LIGHTS.forEach(([lx, ly], i) => {
    ell(x, lx, ly, 15, 4.5); x.fillStyle = '#1d1a18'; x.fill();
    x.strokeStyle = i % 2 ? '#2a2826' : '#7a5a2a'; x.lineWidth = 2.2; x.beginPath(); x.moveTo(lx, ly);
    x.bezierCurveTo(lx + 10, ly + 60, lx - 26, ly + 110, lx + 6 + i * 4, ly + 150 + i * 20); x.stroke();
  });
  const loop = (cx, cy, s) => { x.strokeStyle = '#d8d2c4'; x.lineWidth = 2.6; x.beginPath(); x.moveTo(cx, cy); x.bezierCurveTo(cx - 20 * s, cy + 60 * s, cx + 26 * s, cy + 90 * s, cx + 4, cy + 40 * s); x.bezierCurveTo(cx - 12, cy + 20 * s, cx + 18, cy + 70 * s, cx + 2, cy + 120 * s); x.stroke(); ell(x, cx, cy, 6, 6); x.fillStyle = '#1d1a18'; x.fill(); };
  loop(757, 255, 1); loop(1115, 300, .9); loop(640, 125, 1.2); loop(875, 125, 1.2);
  // plumbing stubs
  const stub = (sx, sy, col, r = 6) => { ell(x, sx, sy, r, r); x.fillStyle = col; x.fill(); x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 1; x.stroke(); };
  stub(430, 470, '#b8743e'); stub(462, 470, '#b8743e'); stub(445, 250, '#b8743e', 5);
  stub(735, 585, '#c9c9c4'); stub(780, 585, '#c9c9c4'); stub(757, 610, '#f0efe9', 10);
  stub(1115, 600, '#f3f2ee', 18); stub(1160, 640, '#c9c9c4');
  // tile boxes waiting in the corner
  const box = (bx, by, bw, bh, d) => {
    poly(x, [[bx, by], [bx + bw, by], [bx + bw - d, by - d * .45], [bx - d, by - d * .45]]); x.fillStyle = '#c4a57a'; x.fill();
    x.fillStyle = '#a8865a'; x.fillRect(bx, by, bw, bh);
    poly(x, [[bx, by], [bx - d, by - d * .45], [bx - d, by + bh - d * .45], [bx, by + bh]]); x.fillStyle = '#8f7049'; x.fill();
    x.fillStyle = 'rgba(255,255,255,.55)'; x.fillRect(bx + 14, by + 12, bw * .45, 6);
  };
  box(1350, 790, 150, 60, 40); box(1362, 736, 130, 54, 36); box(1180, 740, 110, 46, 28);
  x.fillStyle = 'rgba(40,35,30,.2)'; ell(x, 1420, 856, 120, 12); x.fill();
  // flat, cool site lighting
  x.fillStyle = 'rgba(160,172,186,.12)'; x.fillRect(0, 0, W, H);
  L.raw = c;
}

function buildFloor() {
  const [c, x] = layer();
  x.save(); poly(x, FLOOR); x.clip();
  const Zs = [1, .87, .74, .61, .48];
  for (let r = 0; r < Zs.length - 1; r++) for (let k = 0; k < 8; k++) {
    const X0 = -470 + k * 117.5, X1 = X0 + 117.5, Za = Zs[r], Zb = Zs[r + 1];
    poly(x, [P(X0, 290, Za), P(X1, 290, Za), P(X1, 290, Zb), P(X0, 290, Zb)]);
    const l = 86 + R() * 4; x.fillStyle = `hsl(36 ${18 + R() * 6}% ${l}%)`; x.fill();
    x.strokeStyle = 'rgba(160,140,120,.55)'; x.lineWidth = 1.4; x.stroke();
  }
  grain(x, () => poly(x, FLOOR), .35);
  x.fillStyle = lin(x, 0, 700, 0, 900, [[0, 'rgba(60,40,25,.18)'], [.25, 'rgba(60,40,25,0)'], [1, 'rgba(255,255,255,.08)']]); x.fillRect(0, 700, W, 200);
  x.strokeStyle = '#3b3632'; x.lineWidth = 3; x.beginPath(); x.moveTo(345, 708); x.lineTo(548, 708); x.stroke();

}

function buildPlaster() {
  const [c, x] = layer();
  [[CEIL, '#efe6d9'], [RWALL, '#dfd1bd']].forEach(([s, f]) => { poly(x, s); x.fillStyle = f; x.fill(); });
  x.fillStyle = '#e8dccb'; x.fillRect(330, 120, 940, 580);
  x.fillStyle = lin(x, 0, 120, 0, 700, [[0, 'rgba(255,255,255,.18)'], [1, 'rgba(120,90,60,.08)']]); x.fillRect(330, 120, 940, 580);
  grain(x, () => { x.beginPath(); x.rect(330, 120, 940, 580); poly(x, CEIL); }, .22);
  grain(x, () => poly(x, RWALL), .22);
  edgeShade(x, .12);
  LIGHTS.forEach(([lx, ly]) => { ell(x, lx, ly, 16, 4.8); x.fillStyle = '#c7baa7'; x.fill(); ell(x, lx, ly + .5, 11, 3.2); x.fillStyle = '#f7f2ea'; x.fill(); });
  L.plaster = c;
}

function buildMarble() {
  const T = document.createElement('canvas'); T.width = 1400; T.height = 900; const t = T.getContext('2d'); t.lineCap = 'round';
  t.fillStyle = lin(t, 0, 0, 0, 900, [[0, '#7c3029'], [.5, '#6a2822'], [1, '#56201b']]); t.fillRect(0, 0, 1400, 900);
  for (let i = 0; i < 260; i++) { const cx = R() * 1400, cy = R() * 900, r = 40 + R() * 170; t.fillStyle = rad(t, cx, cy, r, [[0, R() < .55 ? 'rgba(160,72,60,.16)' : 'rgba(40,10,8,.18)'], [1, 'rgba(0,0,0,0)']]); t.fillRect(cx - r, cy - r, r * 2, r * 2); }
  const vein = (x0, y0, ang, steps, w, a, depth) => {
    let px = x0, py = y0; t.beginPath(); t.moveTo(px, py);
    const pts = [];
    for (let i = 0; i < steps; i++) { ang += (R() - .5) * .55; px += Math.cos(ang) * 7; py += Math.sin(ang) * 7; t.lineTo(px, py); pts.push([px, py, ang]); }
    t.strokeStyle = `rgba(244,224,214,${a * .25})`; t.lineWidth = w * 3.5; t.stroke();
    t.strokeStyle = `rgba(246,228,218,${a})`; t.lineWidth = w; t.stroke();
    if (depth < 2) pts.forEach(([bx, by, ba]) => { if (R() < .025) vein(bx, by, ba + (R() < .5 ? .9 : -.9), 10 + R() * 40, w * .55, a * .8, depth + 1); });
  };
  for (let i = 0; i < 34; i++) vein(R() * 1400, R() * 900, (R() < .5 ? -.7 : 2.4) + (R() - .5) * .8, 40 + R() * 160, .6 + R() * 1.9, .35 + R() * .5, 0);
  const tg = t.createPattern(noise, 'repeat'); t.globalAlpha = .5; t.fillStyle = tg; t.fillRect(0, 0, 1400, 900); t.globalAlpha = 1;

  const [c, x] = layer();
  // left wall: draw the slab in thin vertical strips so it foreshortens with depth
  const zFront = 470 / 800;
  for (let sx = 0; sx < 330; sx += 2) {
    const Z = 470 / (800 - sx), u = (Z - zFront) / (1 - zFront) * 900;
    x.drawImage(T, Math.min(899, u), 0, 2.5, 900, sx, lwTop(sx), 2.6, lwBot(sx) - lwTop(sx));
  }
  x.fillStyle = lin(x, 0, 0, 330, 0, [[0, 'rgba(20,6,4,.35)'], [1, 'rgba(20,6,4,0)']]); poly(x, LWALL); x.fill();
  x.drawImage(T, 900, 0, 360, 900, 330, 120, 230, 580);
  x.fillStyle = lin(x, 330, 0, 380, 0, [[0, 'rgba(15,4,2,.45)'], [1, 'rgba(15,4,2,0)']]); x.fillRect(330, 120, 50, 580);
  x.strokeStyle = 'rgba(15,4,2,.6)'; x.lineWidth = 1.5; x.beginPath(); x.moveTo(330, 120); x.lineTo(330, 700); x.moveTo(445, 120); x.lineTo(445, 700); x.stroke();
  // niche
  x.fillStyle = '#2a110e'; x.fillRect(372, 328, 150, 52);
  x.fillStyle = 'rgba(255,255,255,.08)'; x.fillRect(372, 376, 150, 4);
  // mixer
  ell(x, 470, 455, 15, 15); x.fillStyle = '#151312'; x.fill(); x.strokeStyle = '#151312'; x.lineWidth = 5; x.beginPath(); x.moveTo(470, 455); x.lineTo(492, 448); x.stroke();
  // rain head on a ceiling drop
  const [hx, hy] = P(-330, -290, .85);
  x.strokeStyle = '#141211'; x.lineWidth = 5; x.beginPath(); x.moveTo(hx, hy); x.lineTo(hx, 150); x.stroke();
  ell(x, hx, 154, 48, 8); x.fillStyle = '#141211'; x.fill();
  L.marble = c;
}

function buildGlass() {
  const [c, x] = layer();
  const a = P(-240, -290, 1), b = P(-240, 290, 1), cc = P(-240, 290, .62), d = P(-240, -290, .62);
  poly(x, [a, b, cc, d]); x.fillStyle = 'rgba(200,222,226,.10)'; x.fill();
  x.save(); poly(x, [a, b, cc, d]); x.clip();
  x.fillStyle = lin(x, 420, 100, 560, 500, [[0, 'rgba(255,255,255,0)'], [.45, 'rgba(255,255,255,.16)'], [.55, 'rgba(255,255,255,0)']]); x.fillRect(380, 0, 200, H);
  x.restore();
  x.strokeStyle = '#121010'; x.lineWidth = 7;
  x.beginPath(); x.moveTo(...a); x.lineTo(...b); x.moveTo(...d); x.lineTo(...cc); x.moveTo(...a); x.lineTo(...d); x.moveTo(...b); x.lineTo(...cc); x.stroke();
  x.lineWidth = 5; const m1 = P(-240, -60, .8), m2 = P(-240, -60, .62); x.beginPath(); x.moveTo(...m1); x.lineTo(...m2); x.stroke();
  L.glass = c;
}

const SLATS = [];
function buildSlats() {
  const [c, x] = layer();
  x.fillStyle = '#331810'; x.fillRect(960, 120, 310, 580);
  for (let sx = 962; sx < 1268; sx += 24) {
    SLATS.push(sx);
    x.fillStyle = lin(x, sx, 0, sx + 18, 0, [[0, '#6f3820'], [.35, '#9a5534'], [.7, '#8c4a2c'], [1, '#64321c']]); x.fillRect(sx, 120, 18, 580);
    x.strokeStyle = 'rgba(50,20,10,.28)'; x.lineWidth = .8;
    for (let g = 0; g < 4; g++) { const gx = sx + 3 + R() * 12; x.beginPath(); x.moveTo(gx, 120); for (let y = 120; y <= 700; y += 40) x.lineTo(gx + Math.sin(y * .02 + g) * 1.4, y); x.stroke(); }

  x.fillStyle = '#2a120a'; x.fillRect(972, 360, 288, 38);
  x.fillStyle = '#8c4e30'; x.fillRect(972, 394, 288, 5);

  L.slats = c;
}

function buildVanity() {
  const [c, x] = layer();
  x.fillStyle = rad(x, 757, 650, 230, [[0, 'rgba(60,35,20,.22)'], [1, 'rgba(60,35,20,0)']]); x.save(); x.translate(757, 650); x.scale(1, .18); x.translate(-757, -650); x.fillRect(527, 420, 460, 460); x.restore();
  const Zf = .85, tl = P(-200, 110, 1), tr = P(130, 110, 1), fl = P(-200, 110, Zf), fr = P(130, 110, Zf);
  const th = 20 / Zf, bot = fl[1] + th + 56;
  // cabinet
  x.fillStyle = lin(x, 0, fl[1] + th, 0, bot, [[0, '#7a4226'], [1, '#5c2f19']]); x.fillRect(fl[0] + 6, fl[1] + th, fr[0] - fl[0] - 12, bot - fl[1] - th);
  x.fillStyle = 'rgba(20,8,4,.5)'; x.fillRect((fl[0] + fr[0]) / 2 - 1, fl[1] + th + 4, 2, bot - fl[1] - th - 8);
  for (let gx = fl[0] + 14; gx < fr[0] - 10; gx += 7) { x.fillStyle = 'rgba(40,16,6,.25)'; x.fillRect(gx, fl[1] + th, 1, bot - fl[1] - th); }
  // stone top
  poly(x, [tl, tr, fr, fl]); x.fillStyle = '#f3eee6'; x.fill();
  x.fillStyle = '#e2d9cc'; x.fillRect(fl[0], fl[1], fr[0] - fl[0], th);
  x.fillStyle = 'rgba(255,255,255,.6)'; x.fillRect(fl[0], fl[1], fr[0] - fl[0], 1.5);
  // vessel basin

const cache = new Map();

function loadMedia() {

    return f;

}
function renderAny(x, p, w, h, o = {}) {

  const m = CFG.media, n = frames.length, mode = m.mode === 'auto' ? (n > 24 ? 'frames' : 'fade') : m.mode;
  const zoom = o.zoom ?? (m.zoom ? 1.06 - .06 * ease(p) : 1), fx = o.fx ?? (m.focusX ?? 50) / 100, f = p * (n - 1);
  if (mode === 'frames' || n === 1) { const fr = nearest(Math.round(f)); if (fr) cover(x, fr.img, w, h, 1, zoom, fx); return; }
  const i = Math.floor(f), t = f - i, a = frames[i] && frames[i].ok ? frames[i] : nearest(i), b = frames[i + 1];

        h('button', { class: 'btn', type: 'button', onclick: async () => { exportMsg = await offer(new Blob([JSON.stringify(cfg, null, 2)], { type: 'application/json' }), slug() + '-settings.json'); renderPanel(); } }, 'Download settings'),
        h('label', { class: 'btn', for: 'file-json' }, 'Import settings'))),
    group('Start over', h('p', { class: 'note' }, 'Restores the demo text, colors and sections. Your images stay.'),
      confirmBtn('Reset text and colors', 'Click again to reset', () => { const items = cfg.media.items, img = cfg.about.image; cfg = structuredClone(DEFAULT); cfg.media.items = items; cfg.about.image = img; changed(); renderPanel(); })),
  ];
}

const PANELS = { media: panelMedia, story: panelStory, style: panelStyle, sections: panelSections, export: panelExport };
function renderPanel() {
  const panel = $('#panel'), top = panel.dataset.tab === tab ? panel.scrollTop : 0;
  document.querySelectorAll('[data-tab]').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === tab));
  panel.replaceChildren(...PANELS[tab]().filter(Boolean));
  panel.dataset.tab = tab; panel.scrollTop = top;
}

/* ---------- boot ---------- */
async function waitFor(fn, ms) { const t0 = Date.now(); while (!fn() && Date.now() - t0 < ms) await new Promise(r => setTimeout(r, 50)); return !!fn(); }
async function cap(name) { try { return await window.claude.use(name); } catch { return null; } }
async function boot() {
  const inViewer = await waitFor(() => window.claude && window.claude.use, 1500);
  if (inViewer) [db, assets, user, downloads] = await Promise.all(['db', 'assets', 'user', 'downloads'].map(cap));
  canEdit = !inViewer || !!assets || !!(user && await user.canEdit().catch(() => false));
  if (db) {
    try { const snap = await db.doc(DOC).get(); if (snap.exists) { lastSaved = snap.data().json; cfg = merge(DEFAULT, JSON.parse(lastSaved)); } } catch {}
  } else if (!inViewer) {
    try { const d = localStorage.getItem('scroll-studio'); if (d) cfg = merge(DEFAULT, JSON.parse(d)); } catch {}
    cfg.media.items = cfg.media.items.filter(i => !i.key.startsWith('local-'));
    if (cfg.about.image && cfg.about.image.key.startsWith('local-')) cfg.about.image = null;
  }
  if (inViewer && (!canEdit || !db)) { openSite(false); return; }
  mode = db && assets ? 'live' : 'local';
  setSave(mode === 'live' ? 'saved' : 'local');
  if (db) db.doc(DOC).onSnapshot(s => {
    if (dirty || !s.exists || s.metadata.hasPendingWrites) return;
    const j = s.data().json; if (j === lastSaved) return;
    lastSaved = j; cfg = merge(DEFAULT, JSON.parse(j)); renderPanel(); pushCfg();
  }, () => {});
  renderPanel(); mountPreview(); refreshUsage();
}
renderPanel(); mountPreview(); boot();
})();
</script>
